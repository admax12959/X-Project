# Example configuration. Point XP_CONFIG at a copy of this file.
# Environment variables (XP_*) override every value here; see docs/dev.md.
listen: ":8080"
web_dir: ""                 # built frontend dir; the Docker image sets /srv/web
database:
  dsn: "xproject:xproject-pw@tcp(127.0.0.1:3306)/xproject"
  connect_timeout: 90s      # keep retrying while MySQL starts
admin:                      # initial administrator, used only on the very first start
  username: admin
  password: change-me-now
  display_name: Administrator
  email: ""
session:
  ttl: 12h
  cookie_secure: false      # true when served over HTTPS
# ldap:                     # optional; without ldap.url the login page offers local login only
#   url: "ldaps://ldap.corp.example:636"
#   base_dn: "ou=people,dc=corp,dc=example"
#   bind_dn: "cn=xproject,ou=services,dc=corp,dc=example"   # service account used to search
#   bind_password: ""
#   user_filter: "(uid=%s)"          # exactly one %s
#   login_attr: uid
#   name_attr: displayName
#   email_attr: mail
#   department_attr: department
#   disabled_filter: ""              # matches disabled accounts, e.g. AD: (userAccountControl:1.2.840.113556.1.4.803:=2)
